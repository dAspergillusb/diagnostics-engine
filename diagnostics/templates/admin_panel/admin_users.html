<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-Панель</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/select2.min.css">
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/color-modes.js"></script>
    <script src="/static/js/chart.js"></script>
	 <style>
        /* Стили для бокового меню */
        #sidebarMenu {
            min-height: 100vh; /* Высота на всю высоту вьюпорта */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Тень для бокового меню */
            z-index: 1000; /* Устанавливаем z-index, чтобы меню было поверх основного контента */
        }

        .sidebar .nav-link {
            border-radius: 0; /* Убираем закругление углов */
            color: #333; /* Цвет текста */
        }

        .sidebar .nav-link:hover {
            background: #f8f9fa; /* Фон при наведении */
        }

        .sidebar .nav-link.active {
            background-color: #007bff; /* Фон для активной ссылки */
            color: white; /* Цвет текста для активной ссылки */
        }

        .sidebar .nav-link.passive {
            background-color: #BABABA;
            color: white;
        }
    </style>
</head>
<body>

<!-- Header -->
<nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid">
      <img class="" src="/static/svg/icon_white.svg" alt="" width="auto" height="72">
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color:white">
              {{firstname}} {{lastname}}
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
              <li><a class="dropdown-item" href="{{ url_for('delete_user_submit') }}" type="button">Удалить меня</a></li>
              <li><a class="dropdown-item" href="{{ url_for('logout') }}" type="button">Выход</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
</nav>

<!-- Admin Panel Layout -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Menu -->
        <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" id="red" href="{{ url_for('admin_users', username=username) }}">
                            <span data-feather="home"></span>
                            Пользователи
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link passive" aria-current="page" href="#preredactor">
                            <span data-feather="home"></span>
                            Прередактор
                        </a>
                    </li>
                    <!-- More menu items -->
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Добро пожаловать в Админ-Панель</h1>
            </div>

            <!-- Content goes here -->
            <div class="d-flex align-items-start" id="redactor">
					<p>Данные пока отсутвуют или их не получилось получить из БД</p>
			</div>
            <div class="d-flex align-items-start" id="preredactor">
					<canvas id="myChart" width="900" height="600"></canvas>
			</div>
            <script>
              const ctx = document.getElementById('myChart');
              new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: {{  labels_dates | safe  }},
                  datasets: [{
                    label: "data_1",
                    data: {{  data_all | safe  }},
                    borderWidth: 1
                  },
                  {
                    label: "data_2",
                    data: {{ data_all | safe }},
                    borderWidth: 1
                  }]
                },
                options: {
                  scales: {
                    y: {
                      beginAtZero: true
                    }
                  }
                }
              });
            </script>
        </main>
    </div>
</div>

<footer class="sticky-bottom">
  <nav class="navbar navbar-expand-lg bg-dark">
    <div class="container text-center">
      <p class="mt-2 mb-1" style="color:white">&copy; Все права защищены 2024</p>
    </div>
  </nav>
</footer>

<!-- Bootstrap JS -->
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/select2.min.js"></script>
</body>
<script>
    $(function() {
        $('select').select2();
    });
</script>
<script>
    $(document).ready(function() {
        $(".js-example-basic-multiple").select2();
        $(".js-example-theme-single").select2({
          theme: "classic"
        });
        $(".js-example-theme-multiple").select2({
          theme: "classic"
        });
    });
</script>
</html>
